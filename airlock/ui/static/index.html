<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airlock — live screen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="flash" aria-hidden="true">
  <div class="flash-stamp">
    <span class="flash-word">QUARANTINED</span>
    <span class="flash-family" id="flash-family"></span>
  </div>
</div>

<header id="topbar">
  <div class="brand">
    <svg class="mark" width="22" height="24" viewBox="0 0 24 26" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="shield-g" x1="0" y1="0" x2="24" y2="26">
          <stop offset="0" stop-color="#6ea8ff"/><stop offset="1" stop-color="#34d399"/>
        </linearGradient>
      </defs>
      <path d="M12 1.5 L21.5 5.2 V12 C21.5 18.6 17.3 22.9 12 24.5 C6.7 22.9 2.5 18.6 2.5 12 V5.2 Z"
            stroke="url(#shield-g)" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="12" cy="11" r="2.4" fill="url(#shield-g)"/>
      <path d="M12 13 V17.5" stroke="url(#shield-g)" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <span class="wordmark">AIRLOCK</span>
    <span class="tagline">on-device agent firewall</span>
  </div>
  <div class="stats">
    <div class="stat">
      <span class="stat-num" id="n-screened">0</span>
      <span class="stat-label">screened</span>
    </div>
    <div class="stat stat-red">
      <span class="stat-num" id="n-quarantined">0</span>
      <span class="stat-label">quarantined</span>
    </div>
    <div class="conn" id="conn">
      <span class="dot"></span><span id="conn-label">connecting</span>
    </div>
  </div>
</header>

<main id="layout">

  <section id="feed-col">
    <div class="col-head">
      <h2>Event feed</h2>
      <span class="hint">every verdict, live — newest first</span>
    </div>
    <div id="feed">
      <div class="empty" id="feed-empty">Waiting for events&hellip; route your agent through Airlock.</div>
    </div>
  </section>

  <aside id="rail">

    <section class="panel" id="panel-quarantine">
      <div class="panel-head">
        <h3>Quarantine</h3>
        <span class="count-badge" id="q-count">0</span>
      </div>
      <div class="panel-body" id="q-list"><div class="empty">Nothing captured.</div></div>
    </section>

    <section class="panel" id="panel-sources">
      <div class="panel-head">
        <h3>Sources</h3>
        <span class="asof-tag hidden" id="asof-tag"></span>
      </div>
      <div class="panel-body" id="src-list"><div class="empty">No sources yet.</div></div>
      <div class="replay">
        <div class="replay-row">
          <span class="replay-label">Trust replay</span>
          <button id="live-btn" class="live-btn is-live" type="button">LIVE</button>
        </div>
        <input type="range" id="replay-slider" min="0" max="1000" value="1000" aria-label="trust replay time">
        <div class="replay-ts" id="replay-ts">now</div>
      </div>
    </section>

    <section class="panel" id="panel-policy">
      <div class="panel-head"><h3>Policy</h3></div>
      <div class="panel-body" id="policy-body"><div class="empty">Loading&hellip;</div></div>
    </section>

  </aside>

</main>

<script src="/static/app.js"></script>
</body>
</html>
