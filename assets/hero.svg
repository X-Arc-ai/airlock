<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260">
  <defs>
    <style>
      .bg { fill: #0a0a0b; }
      .chrome-bg { fill: #161618; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      .brand { fill: #f0f0f0; font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', monospace; font-size: 34px; font-weight: 700; letter-spacing: 2px; }
      .tagline { fill: #888888; font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', monospace; font-size: 13px; }
      .prompt-dim { fill: #888888; font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', monospace; font-size: 13px; }
      .prompt-cmd { fill: #f0f0f0; font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', monospace; font-size: 13px; }
      .verdict { fill: #4ade80; font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', monospace; font-size: 13px; }
      .cursor { fill: #4ade80; opacity: 0.9; }
      .xarc { fill: #555555; font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', monospace; font-size: 10px; letter-spacing: 2px; }
      .src-box { fill: none; stroke: #555555; stroke-width: 1; }
      .src-lbl { fill: #888888; font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', monospace; font-size: 11px; }
      .flow { stroke: #555555; stroke-width: 1.2; fill: none; }
      .gate { stroke: #4ade80; stroke-width: 2; }
      .gate-lbl { fill: #4ade80; font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', monospace; font-size: 12px; letter-spacing: 1px; }
      .agent { fill: #e8e8e8; }
      .agent-lbl { fill: #888888; font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', monospace; font-size: 11px; }
      .divert { stroke: #e57373; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
      .q-box { fill: none; stroke: #e57373; stroke-width: 1; }
      .q-lbl { fill: #e57373; font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', monospace; font-size: 11px; }
      .q-chip { fill: none; stroke: #e57373; stroke-width: 1; }
      .q-chip-lbl { fill: #e57373; font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', monospace; font-size: 9px; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="260" rx="8" class="bg"/>

  <!-- Terminal chrome -->
  <rect y="0" width="800" height="32" rx="8" class="chrome-bg"/>
  <rect y="16" width="800" height="16" class="chrome-bg"/>
  <line x1="0" y1="32" x2="800" y2="32" stroke="#222225" stroke-width="1"/>
  <circle cx="20" cy="16" r="5" class="dot-red"/>
  <circle cx="38" cy="16" r="5" class="dot-yellow"/>
  <circle cx="56" cy="16" r="5" class="dot-green"/>

  <!-- ============ LEFT: the input gate ============ -->

  <!-- Flow lines (sources converge toward the agent) -->
  <!-- web: passes the gate -->
  <line x1="108" y1="70" x2="348" y2="128" class="flow"/>
  <!-- email: passes the gate -->
  <line x1="108" y1="128" x2="348" y2="128" class="flow"/>
  <!-- tools: stopped AT the gate -->
  <line x1="108" y1="186" x2="248" y2="152" class="flow"/>

  <!-- The gate (screening checkpoint) -->
  <line x1="248" y1="56" x2="248" y2="196" class="gate"/>
  <text x="248" y="48" text-anchor="middle" class="gate-lbl">airlock</text>

  <!-- Source glyphs -->
  <rect x="50" y="57" width="58" height="26" rx="5" class="src-box"/>
  <text x="79" y="74" text-anchor="middle" class="src-lbl">web</text>
  <rect x="50" y="115" width="58" height="26" rx="5" class="src-box"/>
  <text x="79" y="132" text-anchor="middle" class="src-lbl">email</text>
  <rect x="50" y="173" width="58" height="26" rx="5" class="src-box"/>
  <text x="79" y="190" text-anchor="middle" class="src-lbl">tools</text>

  <!-- The agent -->
  <circle cx="348" cy="128" r="13" class="agent"/>
  <text x="348" y="158" text-anchor="middle" class="agent-lbl">agent</text>

  <!-- Quarantine: diverted line + box -->
  <circle cx="248" cy="152" r="3" fill="#e57373"/>
  <line x1="248" y1="152" x2="220" y2="204" class="divert"/>
  <rect x="141" y="204" width="158" height="26" rx="5" class="q-box"/>
  <text x="152" y="221" class="q-lbl">quarantined</text>
  <rect x="235" y="210" width="53" height="14" rx="3" class="q-chip"/>
  <text x="261" y="220" text-anchor="middle" class="q-chip-lbl">WITHHELD</text>

  <!-- ============ RIGHT: identity ============ -->

  <text x="590" y="96" text-anchor="middle" class="brand">airlock</text>
  <text x="590" y="122" text-anchor="middle" class="tagline">on-device agent firewall</text>

  <text x="509" y="162" class="prompt-dim">$ <tspan class="prompt-cmd">airlock run -- claude</tspan></text>

  <text x="509" y="188" class="verdict">quarantine &#183; span cited</text>
  <text x="509" y="208" class="verdict">nothing leaves the machine</text>

  <!-- Cursor blink -->
  <rect x="509" y="220" width="3" height="14" class="cursor">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- X-Arc watermark -->
  <text x="775" y="248" text-anchor="end" class="xarc">X-ARC</text>
</svg>
